<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storm overflow 3D</title>
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="view" aria-label="3D cutaway of a storm overflow"></div>

  <button id="show-panel" class="show-panel" type="button" hidden>Controls</button>
  <aside id="panel">
    <div id="resize" class="resize" role="separator" aria-label="Resize the controls" tabindex="0"></div>
    <button id="hide-panel" class="hide-panel" type="button" aria-label="Hide the controls" title="Hide the controls">&times;</button>
    <div class="panel-body">
    <section aria-labelledby="storm-heading">
      <h2 id="storm-heading">Storm</h2>
      <div id="presets" class="presets"></div>
      <label class="slider">Rain intensity <output id="intensity-value"></output>
        <input id="intensity" type="range" min="1" max="80" step="1" value="25" />
      </label>
      <label class="slider">Rain lasts <output id="hours-value"></output>
        <input id="hours" type="range" min="0.25" max="6" step="0.25" value="1" />
      </label>
      <fieldset class="ground">
        <legend>Ground before the storm</legend>
        <label><input type="radio" name="ground" value="dry" checked /> Dry ground</label>
        <label><input type="radio" name="ground" value="wet" /> <span id="ground-wet-label">Wet ground</span></label>
      </fieldset>
    </section>

    <section aria-labelledby="now-heading">
      <h2 id="now-heading">Time <span id="clock" class="clock"></span></h2>
      <div class="play-row">
        <button id="play" type="button" aria-pressed="false">Play</button>
        <select id="speed" aria-label="Playback speed">
          <option value="slow">Slow</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Fast</option>
        </select>
      </div>
      <input id="time" type="range" min="0" max="719" value="0" aria-label="Time" />
    </section>

    <section aria-labelledby="run-heading">
      <h2 id="run-heading">This storm</h2>
      <svg id="chart" role="img" aria-label="Rain, street flooding, flow to the works and spill over the 12 hours"></svg>
      <p class="key"><span class="k-rain"></span>rain <span class="k-flood"></span>street floods <span class="k-works"></span>to works <span class="k-spill"></span>spill <span class="k-band"></span>monitor logs a spill</p>
    </section>

    <section class="views" aria-label="Views">
      <button type="button" data-view="overview">Overview</button>
      <button type="button" data-view="street">Street</button>
      <button type="button" data-view="chamber">Chamber</button>
      <button type="button" data-view="outfall">Outfall</button>
      <label class="labels-toggle" title="Or click a part of the model to label it"><input id="labels" type="checkbox" /> All labels</label>
    </section>
    </div>
  </aside>

  <!-- ?compact: a slim icon bar in place of the panel, for small embeds -->
  <div id="mini" class="mini" data-status="dry">
    <div id="mini-storms" class="mini-storms" role="group" aria-label="Storm"></div>
    <button id="mini-play" class="icon" type="button" aria-label="Play" aria-pressed="false"></button>
    <input id="mini-time" type="range" min="0" max="719" value="0" aria-label="Time" />
    <span class="mini-status" role="status"><i aria-hidden="true"></i><span id="mini-status-text"></span></span>
    <button id="mini-labels" class="icon" type="button" aria-label="Labels" title="Labels" aria-pressed="false"></button>
  </div>

  <div id="error" role="alert" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
